[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobileoptimizer"
version = "0.1.0"
description = "Root'suz, geri alınabilir Android optimizasyon aracı (ADB)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["PySide6>=6.7,<7", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.scripts]
mobileoptimizer = "mobileoptimizer.app.main:main"

[tool.setuptools.packages.find]
include = ["mobileoptimizer*"]

[tool.setuptools.package-data]
mobileoptimizer = ["profiles/*.yaml", "locale/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
