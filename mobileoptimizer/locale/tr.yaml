guide.usb_debug: |
  1. Ayarlar > Telefon hakkında > Yazılım bilgileri bölümüne gidin.
  2. "Yapım numarası"na 7 kez dokunun. "Geliştirici modu açıldı" yazısı çıkar.
  3. Ayarlar > Geliştirici seçenekleri > "USB hata ayıklama"yı açın.
  4. Telefonu USB kablosuyla bilgisayara bağlayın ve telefondaki izni onaylayın.
guide.xiaomi_security: |
  Xiaomi / Redmi / POCO için ek adım:
  Geliştirici seçenekleri içinde "USB hata ayıklama (Güvenlik ayarları)" seçeneğini de açın.
  Bu seçenek için telefonda Mi hesabıyla giriş yapılmış ve SIM kart takılı olmalıdır.
  Bu seçenek kapalıysa ayarlar telefona yazılamaz.
guide.windows_driver: |
  Telefon hâlâ görünmüyorsa Windows'ta USB sürücüsü eksik olabilir.
  Samsung için "Samsung USB Driver for Mobile Phones", diğer markalar için
  "Google USB Driver" kurun ve telefonu yeniden takın.
  Kabloyu da değiştirmeyi deneyin: bazı kablolar yalnızca şarj eder.

