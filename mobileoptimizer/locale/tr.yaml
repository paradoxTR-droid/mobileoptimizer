help.smartscreen: "Windows \"bilgisayarınızı korudu\" uyarısı"
guide.smartscreen: |
  Bu program ücretsizdir ve dijital imzası yoktur. Bu yüzden Windows ilk açılışta
  "Windows bilgisayarınızı korudu" uyarısı gösterebilir.
  1. Uyarıdaki "Ek bilgi" yazısına tıklayın.
  2. Çıkan "Yine de çalıştır" düğmesine tıklayın.
  Antivirüs programınız dosyayı karantinaya alırsa: antivirüste "Karantina" bölümünü açın,
  MobileOptimizer klasörünü geri yükleyin ve klasörü "istisnalar" listesine ekleyin.
  Dosyanın değiştirilmediğini kontrol etmek için Komut İstemi'nde şunu çalıştırın:
  certutil -hashfile MobileOptimizer-<sürüm>-windows.zip SHA256
  Çıkan değer, indirme sayfasındaki .sha256 dosyasıyla aynı olmalıdır.

